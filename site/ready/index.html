<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>AIXray download ready — PowerTrue Systems</title>
  <style>
    :root { color-scheme: light; --ink: #102d35; --paper: #f4efe6; --paper-light: #fcfaf6; --copper: #b7673c; --copper-dark: #8d4626; --muted: #5b6d70; }
    * { box-sizing: border-box; }
    body { display: grid; min-height: 100vh; margin: 0; place-items: center; padding: 24px; color: var(--ink); background: var(--paper); font: 16px/1.6 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(660px, 100%); padding: clamp(32px, 7vw, 64px); background: var(--paper-light); border-top: 5px solid var(--copper); box-shadow: 0 24px 70px rgba(7, 30, 37, .15); }
    .brand { margin: 0 0 36px; font-weight: 780; letter-spacing: -.025em; }
    .brand span { color: var(--copper); }
    .eyebrow { margin: 0 0 14px; color: var(--copper-dark); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .76rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0 0 20px; font-family: Georgia, "Times New Roman", serif; font-size: clamp(2.4rem, 8vw, 4.2rem); font-weight: 500; letter-spacing: -.045em; line-height: 1; }
    p { margin: 0 0 24px; color: var(--muted); }
    .button { display: inline-flex; min-height: 52px; align-items: center; justify-content: center; padding: 13px 20px; color: #fff; background: var(--copper); font-weight: 760; text-decoration: none; }
    .button:hover { background: var(--copper-dark); }
    .button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="brand">Power<span>True</span> Systems</p>
    <p class="eyebrow">AIXray v1</p>
    <h1>Request confirmed.</h1>
    <p>The scanner is served directly from this site. Review it before moving it to an AIX or VIOS host.</p>
    <a class="button" href="../aixray-aix.sh" download>Download aixray-aix.sh</a>
  </main>
</body>
</html>
